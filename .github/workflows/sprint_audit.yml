- name: Commit & Push Updated Workflow Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Loop through artifacts and stage only if they exist on disk
          files=(
            "docs/07_architecture/workflow_map.md"
            "docs/07_architecture/sprint_progress_report.md"
          )

          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              git add "$file"
            else
              echo "Notice: Artifact not found, skipping staging: $file"
            fi
          done

          # Check if any changes were staged before committing
          if git diff --staged --quiet; then
            echo "No changes detected in sprint architecture artifacts."
          else
            git commit -m "chore(ci): update sprint workflow map & progress report [skip ci]"
            git push
          fi