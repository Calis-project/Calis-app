[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calis-adaptive-video"
version = "0.1.0"
description = "Context-efficient, coarse-to-fine calisthenics video analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mediapipe>=0.10.35,<0.11",
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.10,<5",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
calis-video = "calis_video.cli:main"
calis-video-api = "calis_video.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["calis_video"]
branch = true
